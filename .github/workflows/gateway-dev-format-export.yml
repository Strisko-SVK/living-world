name: Temporary Gateway DEV formatter export
on:
  push:
    branches: [feat/gateway-dev-local-postgres]
    paths:
      - .github/workflows/gateway-dev-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format selected nonsecret sources and display exact bytes
        run: |
          for f in compose.gateway-dev.yml docs/gateway-dev-local-db.md src/admin/gateway-dev-db.ts src/admin/gateway-dev-db.test.ts; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_FORMAT_FILE_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_FORMAT_FILE_END__:%s\n' "$f"
          done
