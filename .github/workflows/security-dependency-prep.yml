name: Security dependency remediation preparation

on:
  push:
    branches: [security/dependency-prep-20261107]
    paths: [.github/workflows/security-dependency-prep.yml]

permissions:
  contents: read

env:
  DISCORD_ENABLED: "false"
  DISCORD_OUTBOUND_ENABLED: "false"
  LLM_PROVIDER: disabled

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply targeted advisory fixes and regenerate lockfile
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          package = json.loads(path.read_text())
          package['dependencies']['zod'] = '^4.6.6'
          package['devDependencies']['vitest'] = '^4.1.12'
          package['pnpm']['overrides'].update({'source-map-js@<1.2.2': '1.2.2', 'vite@>=7.0.0 <=7.3.6': '7.3.7', 'eslint@10.11.0>minimatch': '11.0.1'})
          path.write_text(json.dumps(package, indent=2) + '\n')
          PY
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write package.json pnpm-lock.yaml
          pnpm audit --audit-level=low
          pnpm typecheck
          pnpm lint
          pnpm test:security
          pnpm test
          pnpm build
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'dependency-candidate'
          out.mkdir()
          (out / 'files.json').write_text(json.dumps({p: Path(p).read_text() for p in ['package.json', 'pnpm-lock.yaml']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-candidate-text
          path: ${{ runner.temp }}/dependency-candidate/files.json
          retention-days: 1
          if-no-files-found: error

  candidate:
    needs: prepare
    if: github.repository == 'Strisko-SVK/living-world' && github.ref == 'refs/heads/security/dependency-prep-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-candidate-text
          path: candidate
      - name: Create unreferenced candidate for connector review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          files = json.loads(Path('candidate/files.json').read_text())
          if set(files) != {'package.json', 'pnpm-lock.yaml'} or any(not isinstance(v, str) or len(v) > 500000 for v in files.values()):
              raise SystemExit('Invalid candidate')
          parent = os.environ['GITHUB_SHA']
          if not re.fullmatch('[a-f0-9]{40}', parent):
              raise SystemExit('Invalid parent')
          base = 'https://api.github.com/repos/Strisko-SVK/living-world'
          def api(path, data=None):
              req = urllib.request.Request(base + path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          tree = api('/git/trees', {'base_tree': api('/git/commits/' + parent)['tree']['sha'], 'tree': [{'path': p, 'mode': '100644', 'type': 'blob', 'content': text} for p, text in sorted(files.items())]})
          result = api('/git/commits', {'message': 'security: remediate dependency advisories with tested lockfile', 'tree': tree['sha'], 'parents': [parent]})
          print('SECURITY_DEPENDENCY_CANDIDATE_SHA=' + result['sha'])
          PY
