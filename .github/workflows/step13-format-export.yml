name: Temporary Step13 Formatter
on:
  push:
    branches: [feat/step13-pilot-scene-policy-gate]
    paths:
      - .github/workflows/step13-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format Step13 offline pilot code
        run: |
          for f in src/admin/discord-pilot-policy.ts src/admin/discord-pilot-policy.test.ts src/db/discord-dev-fixture.db.test.ts docs/step13-pilot-policy.md; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_STEP13_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_STEP13_END__:%s\n' "$f"
          done
