name: M2.15O temporary read-only format export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format and print only public synthetic code in base64
        run: |
          pnpm exec prettier --write src/admin/dev-first-reply-provision.ts src/admin/dev-first-reply-provision.test.ts src/db/dev-first-reply-provision.db.test.ts
          for path in src/admin/dev-first-reply-provision.ts src/admin/dev-first-reply-provision.test.ts src/db/dev-first-reply-provision.db.test.ts; do
            printf 'FORMATTED_BEGIN:%s\\n' "$path"
            base64 -w 0 "$path"
            printf '\\nFORMATTED_END:%s\\n' "$path"
          done
