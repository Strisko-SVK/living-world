name: Temporary Step12 Formatter
on:
  push:
    branches: [feat/step12-pilot-player-enrollment]
    paths: [.github/workflows/step12-format-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format Step12 pilot player files (no secrets)
        run: |
          for f in src/admin/discord-pilot-player.ts src/admin/discord-pilot-player.test.ts src/db/discord-dev-fixture.db.test.ts docs/step12-pilot-player.md; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_STEP12_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_STEP12_END__:%s\n' "$f"
          done
