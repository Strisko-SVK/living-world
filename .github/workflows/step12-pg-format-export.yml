name: Temporary Step12 Pg Query Formatter
on:
  push:
    branches: [fix/step12-serialize-pg-queries]
    paths:
      - .github/workflows/step12-pg-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format warning regression files
        run: |
          for f in src/admin/discord-pilot-player.ts src/db/discord-dev-fixture.db.test.ts docs/step12-pilot-player.md; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_PG9_FMT_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_PG9_FMT_END__:%s\n' "$f"
          done
