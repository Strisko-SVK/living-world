name: M2.15K temporary format snapshot

on:
  push:
    branches:
      - feat/m2.15k-offline-one-shot-consent

permissions:
  contents: read

jobs:
  canonical:
    name: Read-only Prettier export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Export canonical formatting, no repository writes
        run: |
          pnpm exec prettier --write docs/m2.15k-first-live-reply-authorization.md src/offline/npc-one-shot-consent.ts src/offline/npc-one-shot-consent.test.ts
          node -e 'const fs=require("node:fs"); for(const path of ["docs/m2.15k-first-live-reply-authorization.md","src/offline/npc-one-shot-consent.ts","src/offline/npc-one-shot-consent.test.ts"]) console.log("CANONICAL_M215K:"+JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));'
