name: Temporary DEV fixture Prettier export
on:
  push:
    branches:
      - feat/discord-dev-offline-fixture
    paths:
      - .github/workflows/dev-fixture-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files and display exact output
        run: |
          pnpm exec prettier --write README.md src/admin/discord-dev-fixture.ts src/admin/discord-dev-fixture.test.ts src/db/discord-dev-fixture.db.test.ts
          for f in README.md src/admin/discord-dev-fixture.ts src/admin/discord-dev-fixture.test.ts src/db/discord-dev-fixture.db.test.ts; do
            printf '\n__LW_FORMAT_FILE_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_FORMAT_FILE_END__:%s\n' "$f"
          done
