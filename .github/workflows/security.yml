name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/hardening-*"]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DISCORD_ENABLED: "false"
  DISCORD_OUTBOUND_ENABLED: "false"
  LLM_PROVIDER: disabled

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include all public branches, tags and PR heads
        run: |
          git -c credential.helper= fetch --force --prune https://github.com/Strisko-SVK/living-world.git '+refs/heads/*:refs/remotes/audit/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
      - name: Install checksum-verified Gitleaks
        run: bash scripts/security/install-gitleaks.sh
      - name: Scan full reachable history and current files
        run: python3 scripts/security/scan-secrets.py

  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all locked production and development dependencies
        run: pnpm audit --audit-level=low

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-results
      - name: Fail closed on CodeQL findings or missing results
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          paths = list((Path(os.environ['RUNNER_TEMP']) / 'codeql-results').glob('*.sarif'))
          if not paths:
              raise SystemExit('CodeQL result files are missing')
          total = 0
          for path in paths:
              document = json.loads(path.read_text())
              runs = document.get('runs')
              if not isinstance(runs, list) or not runs:
                  raise SystemExit('Invalid CodeQL report')
              for run in runs:
                  for invocation in run.get('invocations', []):
                      if invocation.get('executionSuccessful') is False:
                          raise SystemExit('CodeQL analysis did not complete')
                  results = run.get('results', [])
                  if not isinstance(results, list):
                      raise SystemExit('Invalid CodeQL results')
                  total += len(results)
                  for result in results[:50]:
                      location = (result.get('locations') or [{}])[0].get('physicalLocation', {})
                      print(json.dumps({'event': 'codeql_finding', 'rule': result.get('ruleId'), 'file': location.get('artifactLocation', {}).get('uri'), 'line': location.get('region', {}).get('startLine')}))
          print(json.dumps({'event': 'codeql_result', 'reports': len(paths), 'findings': total}))
          raise SystemExit(1 if total else 0)
          PY
