name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Temporary M2.14 formatting probe
        run: |
          set -euo pipefail
          for f in src/admin/discord-npc-e2e-activation.ts src/admin/discord-npc-e2e-activation.test.ts src/db/discord-npc-e2e-activation.db.test.ts; do
            echo "PRETTIER_START $f"
            pnpm exec prettier "$f" | base64 -w0 | fold -w 120
            echo
            echo "PRETTIER_END $f"
          done

      - name: Run quality gate
        run: pnpm quality:gate

  postgres:
    name: PostgreSQL 17 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: living_world_ci
          POSTGRES_USER: living_world_ci
          POSTGRES_PASSWORD: isolated_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U living_world_ci -d living_world_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://living_world_ci:isolated_ci_password@localhost:5432/living_world_ci
      DISCORD_ENABLED: "false"
      LLM_PROVIDER: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated database configuration
        run: cp .env.example .env
      - name: Apply real migrations
        run: pnpm db:migrate
      - name: Run PostgreSQL integration tests
        run: pnpm test:db

  gateway-dev:
    name: Isolated Gateway DEV PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate disposable local DB credentials
        run: node --import tsx src/admin/gateway-dev-db.ts init
      - name: Start dedicated isolated PostgreSQL 17
        run: |
          docker compose --env-file .env.gateway-dev.local -f compose.gateway-dev.yml config --quiet
          docker compose --env-file .env.gateway-dev.local -f compose.gateway-dev.yml up -d --wait
      - name: Verify DB identity and apply real migrations
        run: |
          node --env-file=.env.gateway-dev.local --import tsx src/admin/gateway-dev-db.ts check
          node --env-file=.env.gateway-dev.local --import tsx src/admin/gateway-dev-db.ts migrate
      - name: Offline CLI fixture preview, apply and replay
        env:
          LW_DEV_GUILD_ID: "1111111111111111111"
          LW_DEV_PARENT_CHANNEL_ID: "1222222222222222222"
          LW_DEV_THREAD_ID: "1333333333333333333"
        run: |
          PREVIEW="$(node --env-file=.env.gateway-dev.local --import tsx src/admin/discord-dev-fixture.ts)"
          test "$PREVIEW" = '{"status":"would_create","worldKey":"lw-dev-gateway-001"}'
          CREATED="$(node --env-file=.env.gateway-dev.local --import tsx src/admin/discord-dev-fixture.ts --apply --confirm-database living_world_gateway_dev)"
          printf '%s' "$CREATED" | grep -q '"status":"created"'
          REPLAY="$(node --env-file=.env.gateway-dev.local --import tsx src/admin/discord-dev-fixture.ts)"
          printf '%s' "$REPLAY" | grep -q '"status":"already_present"'
      - name: Dispose CI-only PostgreSQL and volume
        if: always()
        run: |
          if [ -f .env.gateway-dev.local ]; then
            docker compose --env-file .env.gateway-dev.local -f compose.gateway-dev.yml down --volumes --remove-orphans
          fi
