name: M2.15M temporary Drizzle migration export

on:
  push:
    branches:
      - feat/m2.15m-persistent-one-shot-consent

permissions:
  contents: read

jobs:
  generate:
    name: Canonical read-only migration export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      DISCORD_ENABLED: "false"
      DISCORD_OUTBOUND_ENABLED: "false"
      LLM_PROVIDER: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate schema migration without DB connection
        run: |
          pnpm exec prettier --write src/db/schema/dev-first-reply-consents.ts src/db/schema/index.ts
          pnpm exec drizzle-kit generate --name dev_first_reply_consents
          node -e 'const fs=require("node:fs"); for(const path of ["src/db/schema/dev-first-reply-consents.ts","src/db/schema/index.ts","src/db/migrations/0019_dev_first_reply_consents.sql","src/db/migrations/meta/_journal.json","src/db/migrations/meta/0019_snapshot.json"]) { console.log("M215M_EXPORT:"+JSON.stringify({path,content:fs.readFileSync(path,"utf8")})); }'
