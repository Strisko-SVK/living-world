name: Temporary Gateway Smoke Formatter
on:
  push:
    branches: [feat/discord-gateway-inbound-smoke]
    paths:
      - .github/workflows/gateway-smoke-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format nonsecret smoke files
        run: |
          for f in src/admin/discord-gateway-smoke.ts src/admin/discord-gateway-smoke.test.ts docs/discord-gateway-smoke.md; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_FMT_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_FMT_END__:%s\n' "$f"
          done
