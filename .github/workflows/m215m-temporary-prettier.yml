name: M2.15M temporary canonical formatting

on:
  push:
    branches:
      - feat/m2.15m-persistent-one-shot-consent

permissions:
  contents: read

jobs:
  export:
    name: Read-only Prettier export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical format in disposable checkout only
        run: |
          pnpm exec prettier --write docs/m2.15m-persistent-dev-one-shot-consent.md src/admin/dev-first-reply-consent.repository.ts src/admin/dev-first-reply-consent.repository.test.ts src/admin/scene-policy-migration-preflight.ts src/admin/scene-policy-migration-preflight.test.ts src/db/discord-npc-e2e-inbound.db.test.ts src/db/schema/dev-first-reply-consents.ts src/db/schema/index.ts
          node -e 'const fs=require("node:fs"); for(const path of ["docs/m2.15m-persistent-dev-one-shot-consent.md","src/admin/dev-first-reply-consent.repository.ts","src/admin/dev-first-reply-consent.repository.test.ts","src/admin/scene-policy-migration-preflight.ts","src/admin/scene-policy-migration-preflight.test.ts","src/db/discord-npc-e2e-inbound.db.test.ts","src/db/schema/dev-first-reply-consents.ts","src/db/schema/index.ts"]) console.log("M215M_FORMAT:"+JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));'
