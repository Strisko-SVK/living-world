name: Temporary Step14 Shutdown Formatter
on:
  push:
    branches: [feat/step14-pilot-inbound-gateway]
    paths:
      - .github/workflows/step14-shutdown-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format Step14 shutdown safety source
        run: |
          for f in src/admin/discord-pilot-gateway.ts src/admin/discord-pilot-gateway.test.ts; do
            pnpm exec prettier --write "$f"
            printf '\n__LW_STEP14_SHUTDOWN_BEGIN__:%s\n' "$f"
            cat "$f"
            printf '\n__LW_STEP14_SHUTDOWN_END__:%s\n' "$f"
          done
