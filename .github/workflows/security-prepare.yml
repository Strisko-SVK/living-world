name: Security preparation (temporary)

on:
  push:
    branches: [security/hardening-20261107]
    paths:
      - .github/workflows/security-prepare.yml
      - package.json

permissions:
  contents: read

env:
  DISCORD_ENABLED: "false"
  DISCORD_OUTBOUND_ENABLED: "false"
  LLM_PROVIDER: disabled

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate only the dependency lock and reviewable formatting
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/security/init-local-env.mjs')
          s = p.read_text()
          if 'import console from "node:console";' not in s:
              p.write_text('import console from "node:console";\n' + s)
          p = Path('README.md')
          old = '1. Copy `.env.example` to `.env` and adjust values if needed.'
          new = '1. Run `pnpm db:init` to create a private `.env` with a random password. Existing\n   `.env` files are never overwritten. See [security operations](docs/security-operations.md)\n   for existing databases, credential rotation and host verification.'
          s = p.read_text()
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write pnpm-lock.yaml package.json README.md scripts/security/init-local-env.mjs scripts/security/security.test.mjs docs/security-operations.md .github/dependabot.yml
          pnpm test:security
          pnpm exec eslint scripts/security/init-local-env.mjs scripts/security/security.test.mjs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          paths = ['pnpm-lock.yaml', 'package.json', 'README.md', 'scripts/security/init-local-env.mjs', 'scripts/security/security.test.mjs', 'docs/security-operations.md', '.github/dependabot.yml']
          out = Path(os.environ['RUNNER_TEMP']) / 'security-candidate'
          out.mkdir()
          (out / 'files.json').write_text(json.dumps({p: Path(p).read_text() for p in paths}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-candidate-text
          path: ${{ runner.temp }}/security-candidate/files.json
          retention-days: 1
          if-no-files-found: error

  candidate:
    needs: prepare
    if: github.repository == 'Strisko-SVK/living-world' && github.ref == 'refs/heads/security/hardening-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-candidate-text
          path: candidate
      - name: Create unreferenced candidate commit without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          allowed = {'pnpm-lock.yaml', 'package.json', 'README.md', 'scripts/security/init-local-env.mjs', 'scripts/security/security.test.mjs', 'docs/security-operations.md', '.github/dependabot.yml'}
          files = json.loads(Path('candidate/files.json').read_text())
          if set(files) != allowed or any(not isinstance(v, str) or len(v) > 500000 for v in files.values()):
              raise SystemExit('Candidate validation failed')
          parent = os.environ['GITHUB_SHA']
          if not re.fullmatch('[a-f0-9]{40}', parent):
              raise SystemExit('Invalid parent')
          base = 'https://api.github.com/repos/Strisko-SVK/living-world'
          def api(path, data=None):
              req = urllib.request.Request(base + path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          commit = api('/git/commits/' + parent)
          tree = api('/git/trees', {'base_tree': commit['tree']['sha'], 'tree': [{'path': p, 'mode': '100644', 'type': 'blob', 'content': content} for p, content in sorted(files.items())]})
          result = api('/git/commits', {'message': 'security: regenerate reviewed lockfile and format hardening changes', 'tree': tree['sha'], 'parents': [parent]})
          print('SECURITY_CANDIDATE_SHA=' + result['sha'])
          PY
