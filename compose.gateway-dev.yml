name: living-world-gateway-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${LW_GATEWAY_DEV_ADMIN_PASSWORD:?Generate .env.gateway-dev.local first}
      LW_GATEWAY_DEV_ROLE_PASSWORD: ${LW_GATEWAY_DEV_ROLE_PASSWORD:?Generate .env.gateway-dev.local first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gateway_dev_data:/var/lib/postgresql/data
      - ./infra/gateway-dev/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d living_world_gateway_dev"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  gateway_dev_data:
